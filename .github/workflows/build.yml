name: build
on:
  push:
    branches:
      - 'arena/*'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install WiX
        run: choco install wixtoolset -y
        shell: powershell
      
      - name: Build MSI
        run: .\gradlew.bat packageMsi --no-daemon
        shell: powershell
      
      - name: Build Portable Distribution
        run: .\gradlew.bat createDistributable --no-daemon
        shell: powershell
      
      - name: Create Portable ZIP
        run: |
          $distDir = "build/compose/binaries/main/app"
          $zipPath = "build/Solgram-2.0.0-portable.zip"
          if (Test-Path $distDir) {
            Compress-Archive -Path "$distDir\*" -DestinationPath $zipPath -Force
            $size = (Get-Item $zipPath).Length / 1MB
            Write-Host "Portable ZIP size: $size MB"
          }
        shell: powershell
      
      - name: List artifacts
        run: |
          dir build\compose\binaries\main\msi\ -ErrorAction SilentlyContinue
          dir build\*.zip -ErrorAction SilentlyContinue
        shell: powershell
      
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: solgram-installer-msi
          path: build/compose/binaries/main/msi/*.msi
      
      - name: Upload Portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: solgram-portable-zip
          path: build/Solgram-2.0.0-portable.zip
      
      - name: Create GitHub Release with MSI + Portable
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.0-msi-${{ github.run_number }}
          name: Solgram 2.0.0 - MSI + Portable
          body: |
            Two downloads:
            1. MSI installer (~95-110 MB)
            2. Portable ZIP (~90-100 MB) - Extract and run Solgram.exe, no install needed, faster for testing!
            Commit: ${{ github.sha }}
          files: |
            build/compose/binaries/main/msi/*.msi
            build/Solgram-2.0.0-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
