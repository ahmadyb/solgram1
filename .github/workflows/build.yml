name: build
on:
  push:
    branches:
      - 'arena/*'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install WiX
        run: choco install wixtoolset -y
        shell: powershell
      - name: Build MSI only
        run: .\gradlew.bat packageMsi --no-daemon
        shell: powershell
      - name: List MSI
        run: dir build\compose\binaries\main\msi\
        shell: powershell
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: solgram-installer-msi
          path: build/compose/binaries/main/msi/*.msi
      - name: Create GitHub Release with MSI
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.0-msi-${{ github.run_number }}
          name: Solgram 2.0.0 MSI
          body: |
            Solgram 2.0.0 - Native Kotlin Telegram Client
            Built on windows-latest with JDK 17 + WiX
            Commit: ${{ github.sha }}
            File: Solgram-2.0.0.msi (122 MB, JVM bundled)
          files: build/compose/binaries/main/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
