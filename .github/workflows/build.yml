name: build
on:
  push:
    branches:
      - 'arena/*'
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install WiX
        run: choco install wixtoolset -y
        shell: powershell

      - name: Check environment
        run: |
          java -version
          .\gradlew.bat doctor --no-daemon
        shell: powershell

      - name: Run tests and detekt
        run: .\gradlew.bat test detekt --no-daemon
        shell: powershell
        continue-on-error: true

      - name: Build MSI and EXE
        run: .\gradlew.bat packageMsi packageExe --no-daemon
        shell: powershell

      - name: List binaries
        run: |
          dir build\compose\binaries\main\msi\
          dir build\compose\binaries\main\exe\
        shell: powershell

      - name: Create dist folder
        run: |
          mkdir dist -Force
          Copy-Item -Path build\compose\binaries\main\msi\*.msi -Destination dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item -Path build\compose\binaries\main\exe\*.exe -Destination dist\ -Force -ErrorAction SilentlyContinue
          dir dist\
        shell: powershell

      - name: Commit installers back
        run: |
          git config user.name "Solgram Builder"
          git config user.email "builder@solgram.local"
          git add dist/ -f
          git commit -m "Add built MSI/EXE installers [skip ci]" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed"
        shell: powershell
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: solgram-installers
          path: |
            build/compose/binaries/main/**/*.{msi,exe}
            dist/
