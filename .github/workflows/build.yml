name: build
on:
  push:
    branches:
      - 'arena/*'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install WiX
        run: choco install wixtoolset -y
        shell: powershell
      - name: Build MSI only
        run: .\gradlew.bat packageMsi --no-daemon
        shell: powershell
      - name: Create dist folder (MSI only)
        run: |
          mkdir dist -Force
          Remove-Item -Path dist\*.exe -Force -ErrorAction SilentlyContinue
          Remove-Item -Path dist\*.zip -Force -ErrorAction SilentlyContinue
          Copy-Item -Path build\compose\binaries\main\msi\*.msi -Destination dist\ -Force
          dir dist\
        shell: powershell
      - name: Commit installer back
        run: |
          git config user.name "Solgram Builder"
          git config user.email "builder@solgram.local"
          git add dist/ -f
          try { git commit -m "Add built MSI installer [skip ci]" } catch { echo "No changes" }
          git push origin HEAD:arena/01a03fdc-solgram1
        shell: powershell
      - uses: actions/upload-artifact@v4
        with:
          name: solgram-installer-msi
          path: |
            build/compose/binaries/main/msi/*.msi
            dist/*.msi
