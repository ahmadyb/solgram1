name: build
on:
  push:
    branches:
      - 'arena/*'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install WiX
        run: choco install wixtoolset -y
        shell: powershell
      
      - name: Build MSI
        run: .\gradlew.bat packageMsi --no-daemon
        shell: powershell
      
      - name: Build Portable (bundled JVM)
        run: .\gradlew.bat createDistributable --no-daemon
        shell: powershell
      
      - name: Build Ultra-Portable (jar only, smallest)
        run: .\gradlew.bat ultraPortableJar --no-daemon
        shell: powershell
      
      - name: Create ZIPs
        run: |
          $distDir = "build/compose/binaries/main/app"
          $portableZip = "build/Solgram-2.0.0-portable.zip"
          if (Test-Path $distDir) {
            Compress-Archive -Path "$distDir\*" -DestinationPath $portableZip -Force
            $s = (Get-Item $portableZip).Length / 1MB
            Write-Host "Portable ZIP: $s MB"
          }
          $ultraJar = "build/libs/Solgram-2.0.0-ultra-portable.jar"
          $ultraZip = "build/Solgram-2.0.0-ultra-portable.zip"
          if (Test-Path $ultraJar) {
            Compress-Archive -Path $ultraJar -DestinationPath $ultraZip -Force
            $s = (Get-Item $ultraZip).Length / 1MB
            Write-Host "Ultra-Portable ZIP: $s MB"
          }
          dir build/*.zip
          dir build/compose/binaries/main/msi/
        shell: powershell
      
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: solgram-installer-msi
          path: build/compose/binaries/main/msi/*.msi
      
      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: solgram-portable-zip
          path: build/Solgram-2.0.0-portable.zip
      
      - name: Upload Ultra-Portable
        uses: actions/upload-artifact@v4
        with:
          name: solgram-ultra-portable-zip
          path: build/Solgram-2.0.0-ultra-portable.zip
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.0-msi-${{ github.run_number }}
          name: Solgram 2.0.0 - MSI + Portable + Ultra
          body: |
            3 downloads:
            1. MSI ~70-85 MB (installer, bundled JVM)
            2. Portable ~70-85 MB (extract & run, bundled JVM)
            3. Ultra-Portable ~35-50 MB (requires Java 17, smallest!)
            Commit: ${{ github.sha }}
          files: |
            build/compose/binaries/main/msi/*.msi
            build/Solgram-2.0.0-portable.zip
            build/Solgram-2.0.0-ultra-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
