name: build
on:
  push:
    branches:
      - 'arena/*'
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install WiX
        run: choco install wixtoolset -y
        shell: powershell
      - name: Check environment
        run: |
          java -version
          .\gradlew.bat doctor --no-daemon
        shell: powershell
      - name: Run tests and detekt
        run: .\gradlew.bat test detekt --no-daemon
        shell: powershell
        continue-on-error: true
      - name: Build MSI only
        run: .\gradlew.bat packageMsi --no-daemon
        shell: powershell
      - name: List binaries
        run: dir build\compose\binaries\main\msi\
        shell: powershell
      - name: Create dist folder
        run: |
          mkdir dist -Force
          Copy-Item -Path build\compose\binaries\main\msi\*.msi -Destination dist\ -Force -ErrorAction SilentlyContinue
          dir dist\
        shell: powershell
      - name: Commit installer back
        run: |
          git config user.name "Solgram Builder"
          git config user.email "builder@solgram.local"
          git add dist/ -f
          try { git commit -m "Add built MSI installer [skip ci]" } catch { echo "No changes" }
          try { git push origin HEAD:arena/01a03fdc-solgram1 } catch { echo "Push failed" }
        shell: powershell
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: solgram-installer-msi
          path: |
            build/compose/binaries/main/msi/*.msi
            dist/*.msi
